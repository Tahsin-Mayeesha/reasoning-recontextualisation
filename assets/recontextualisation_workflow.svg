<text x="1043.5" y="634" class="label" text-anchor="middle">G</text>
<text x="78" y="689" class="label" text-anchor="start">Constraints</text>
<text x="78" y="724" class="body" text-anchor="start">1. Exactly one of P or T is selected.</text>
<text x="78" y="768" class="body" text-anchor="start">2. If T is selected, Q is selected.</text>
<text x="78" y="812" class="body" text-anchor="start">3. If U is selected,</text>
<text x="78" y="839" class="body" text-anchor="start">    neither P nor R is selected.</text>
<text x="634" y="689" class="label" text-anchor="start">Constraints</text>
<text x="634" y="724" class="body" text-anchor="start">1. Exactly one of A or E is selected.</text>
<text x="634" y="768" class="body" text-anchor="start">2. If E is selected, B is selected.</text>
<text x="634" y="812" class="body" text-anchor="start">3. If F is selected,</text>
<text x="634" y="839" class="body" text-anchor="start">    neither A nor C is selected.</text>
<text x="78" y="889" class="label" text-anchor="start">Question</text>
<text x="78" y="922" class="body" text-anchor="start">If U is selected, which must also</text>
<text x="78" y="949" class="body" text-anchor="start">be selected?</text>
<rect x="78" y="972" width="82" height="36" rx="5" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="119" y="997" class="small" text-anchor="middle">(A) P</text>
<rect x="170" y="972" width="82" height="36" rx="5" fill="#dcf0d7" stroke="#a7b4b8" stroke-width="1.4" />
<text x="211" y="997" class="small" text-anchor="middle">(B) Q</text>
<rect x="262" y="972" width="82" height="36" rx="5" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="303" y="997" class="small" text-anchor="middle">(C) R</text>
<rect x="354" y="972" width="82" height="36" rx="5" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="395" y="997" class="small" text-anchor="middle">(D) S</text>
<rect x="446" y="972" width="82" height="36" rx="5" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="487" y="997" class="small" text-anchor="middle">(E) V</text>
<text x="78" y="1041" class="label green" text-anchor="start">Correct option: B  ·  Q</text>
<text x="323" y="1069" class="small muted" text-anchor="middle">U → not P → T → Q</text>
<text x="634" y="889" class="label" text-anchor="start">Question</text>
<text x="634" y="922" class="body" text-anchor="start">If F is selected, which must also</text>
<text x="634" y="949" class="body" text-anchor="start">be selected?</text>
<rect x="634" y="972" width="82" height="36" rx="5" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="675" y="997" class="small" text-anchor="middle">(A) A</text>
<rect x="726" y="972" width="82" height="36" rx="5" fill="#dcf0d7" stroke="#a7b4b8" stroke-width="1.4" />
<text x="767" y="997" class="small" text-anchor="middle">(B) B</text>
<rect x="818" y="972" width="82" height="36" rx="5" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="859" y="997" class="small" text-anchor="middle">(C) C</text>
<rect x="910" y="972" width="82" height="36" rx="5" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="951" y="997" class="small" text-anchor="middle">(D) D</text>
<rect x="1002" y="972" width="82" height="36" rx="5" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="1043" y="997" class="small" text-anchor="middle">(E) G</text>
<text x="634" y="1041" class="label green" text-anchor="start">Correct option: B  ·  B</text>
<text x="879" y="1069" class="small muted" text-anchor="middle">F → not A → E → B</text>
<text x="590" y="1125" class="label" text-anchor="middle">7→7 entities     ·     4→4 selections     ·     3→3 constraints     ·     Same answer option</text>
<text x="590" y="1158" class="small muted" text-anchor="middle">Illustrative pair: puzzle 113, Q1. The recorded judge accepted the adaptation on its first attempt.</text>
