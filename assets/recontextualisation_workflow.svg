<rect x="398" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="423.5" y="634" class="label" text-anchor="middle">U</text>
<rect x="462" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="487.5" y="634" class="label" text-anchor="middle">V</text>
<rect x="634" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="659.5" y="634" class="label" text-anchor="middle">A</text>
<rect x="698" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="723.5" y="634" class="label" text-anchor="middle">B</text>
<rect x="762" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="787.5" y="634" class="label" text-anchor="middle">C</text>
<rect x="826" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="851.5" y="634" class="label" text-anchor="middle">D</text>
<rect x="890" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
