<text x="634" y="512" class="heading" text-anchor="start">Adapted puzzle</text>
<text x="634" y="544" class="body muted" text-anchor="start">Garden plot · plants</text>
<text x="634" y="585" class="label" text-anchor="start">Select exactly 4 of 7.</text>
<rect x="78" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="103.5" y="634" class="label" text-anchor="middle">P</text>
<rect x="142" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="167.5" y="634" class="label" text-anchor="middle">Q</text>
<rect x="206" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="231.5" y="634" class="label" text-anchor="middle">R</text>
<rect x="270" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
<text x="295.5" y="634" class="label" text-anchor="middle">S</text>
<rect x="334" y="607" width="51" height="39" rx="6" fill="#ffffff" stroke="#a7b4b8" stroke-width="1.4" />
