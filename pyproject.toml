[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-pipeline"
version = "0.1.0"
description = "ReCon logic puzzle narrative transformation experiments"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
api = ["openai>=1.68,<3", "anthropic>=0.49,<1", "google-genai>=1.0,<3"]
analysis = ["jupyterlab>=4,<5", "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "scipy>=1.12,<2", "statsmodels>=0.14,<1", "scikit-learn>=1.4,<2", "numpy>=1.26,<3"]

[tool.setuptools]
packages = ["recon"]
